<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modular FastBEV + Radar AEB Demo</title>
<style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#070b12;color:#edf5ff;font-family:Segoe UI,Arial,sans-serif}#stage{width:100vw;height:100vh;position:relative;display:grid;place-items:center;overflow:hidden}video{width:100%;height:100%;object-fit:contain;background:#000}#hud{position:absolute;inset:0;pointer-events:none}.panel{position:absolute;padding:12px 16px;border:1px solid rgba(91,210,255,.28);background:rgba(3,10,20,.76);border-radius:10px;line-height:1.55}#statusPanel{left:18px;top:18px;min-width:385px}#help{right:18px;bottom:18px}.metric{color:#7dd3fc;font-variant-numeric:tabular-nums}.ok{color:#86efac}.danger{color:#fb7185;font-weight:800}#badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#4b5563;font-size:12px;font-weight:700}#badge.live{background:#087f5b}button{pointer-events:auto;border:1px solid #38bdf8;background:rgba(2,132,199,.92);color:white;font-weight:700;padding:8px 12px;border-radius:8px;cursor:pointer}#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;padding:16px 30px}#routeButtons{margin-top:10px;display:flex;gap:8px}kbd{display:inline-block;min-width:26px;padding:1px 7px;text-align:center;border:1px solid #64748b;border-bottom-width:3px;border-radius:5px;background:#1e293b}</style></head>
<body><main id="stage"><video id="video" autoplay playsinline muted></video><div id="hud"><section id="statusPanel" class="panel">
<div><span id="badge">DISCONNECTED</span>　模式：<span id="mode" class="metric">MANUAL</span></div>
<div>视频：<span id="videoStats" class="metric">--</span></div><div>车速：<span id="speed" class="metric">--</span>　视角：<span id="view" class="metric">LONG LOW CHASE</span></div><hr style="border-color:#233044">
<div>低频 FastBEV：<span id="low" class="metric">--</span></div><div>高频安全/补帧：<span id="high" class="metric">--</span></div><div>当前控制源：<span id="source" class="metric">--</span></div><div>AEB：<span id="aeb" class="metric">NEGATIVE</span></div><div>Radar：<span id="radar" class="metric">--</span></div><div>Reference Path：<span id="route" class="metric">--</span></div><div>采路线：<span id="record" class="metric">OFF</span></div>
<div id="routeButtons"><button id="recordStart">开始采集</button><button id="recordStop">停止并生成 route.csv</button></div></section>
<section id="help" class="panel"><div><kbd>W</kbd>/<kbd>S</kbd> 油门/刹车　<kbd>A</kbd>/<kbd>D</kbd> 转向</div><div><kbd>M</kbd> AUTO/MANUAL　<kbd>C</kbd> 切视角　<kbd>Q</kbd> 倒车</div><div>采路线时保持 MANUAL；AEB 在 AUTO 下优先级最高。</div></section><button id="start">启动实时驾驶</button></div></main>
<script>
const q=s=>document.querySelector(s),video=q('#video'),startButton=q('#start'),badge=q('#badge'),videoStats=q('#videoStats'),mode=q('#mode'),speed=q('#speed'),view=q('#view'),low=q('#low'),high=q('#high'),source=q('#source'),aeb=q('#aeb'),radar=q('#radar'),route=q('#route'),record=q('#record');
const keys={w:false,a:false,s:false,d:false,space:false},views=['LONG LOW CHASE','RACE CHASE','MANUAL CONTROL'];let reverse=false,viewIndex=0,autoEnabled=false,seq=0,pc=null,dc=null,lastFrames=0,lastAt=performance.now();
function send(){if(dc&&dc.readyState==='open')dc.send(JSON.stringify({type:'control',seq:++seq,keys,reverse,view_index:viewIndex,auto_enabled:autoEnabled}))}
function ice(p){if(p.iceGatheringState==='complete')return Promise.resolve();return new Promise(r=>{const f=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',f);r()}};p.addEventListener('icegatheringstatechange',f)})}
async function stats(){if(!pc)return;for(const r of (await pc.getStats()).values())if(r.type==='inbound-rtp'&&(r.kind==='video'||r.mediaType==='video')){const n=performance.now(),dt=Math.max(.001,(n-lastAt)/1000),fps=(r.framesDecoded-lastFrames)/dt;lastFrames=r.framesDecoded;lastAt=n;videoStats.textContent=`${fps.toFixed(1)} FPS · 丢包 ${r.packetsLost||0}`}}
const f=(v,d=1)=>v==null?'--':Number(v).toFixed(d);
async function backend(){try{const s=await(await fetch('/status',{cache:'no-store'})).json(),c=s.control||{},l=c.low||{},h=c.high||{},rd=s.radar||{},rp=s.reference_path||{},rr=s.route_recording||{},p=s.performance||{};speed.textContent=`${f(p.speed_kmh)} km/h`;low.textContent=`${f(l.rate_hz)} Hz · inference ${f(l.inference_ms,0)} ms · RTT ${f(l.gateway_roundtrip_ms,0)} ms · age ${f(l.age_ms,0)} ms · ${l.fsm_state||'--'}`;high.textContent=`${f(h.rate_hz)} Hz · board ${f(h.processing_ms,2)} ms · RTT ${f(h.gateway_roundtrip_ms,2)} ms · age ${f(h.age_ms,0)} ms · ${h.fsm_state||'--'}`;source.textContent=c.active_source||'--';aeb.textContent=c.aeb_triggered?'POSITIVE / BRAKE':'NEGATIVE';aeb.className=c.aeb_triggered?'danger':'ok';radar.textContent=rd.valid?`${f(rd.nearest_distance_m,2)} m · rel ${f(rd.relative_velocity_mps,2)} m/s · age ${f(rd.age_ms,0)} ms`:'无有效目标';route.textContent=rp.loaded?`${rp.points} pts · ${f(rp.length_m,1)} m · ${rp.route_id}`:'MISSING';record.textContent=rr.recording?`ON · ${rr.raw_points} raw pts`:`OFF · ${rr.message||''}`}catch(e){high.textContent='状态接口不可用'}}
async function start(){startButton.disabled=true;pc=new RTCPeerConnection({iceServers:[]});pc.addTransceiver('video',{direction:'recvonly'});dc=pc.createDataChannel('control',{ordered:false,maxRetransmits:0});dc.onopen=()=>setInterval(send,1000/30);pc.ontrack=e=>video.srcObject=e.streams.length?e.streams[0]:new MediaStream([e.track]);pc.onconnectionstatechange=()=>{badge.textContent=pc.connectionState.toUpperCase();badge.classList.toggle('live',pc.connectionState==='connected');if(pc.connectionState==='connected')startButton.style.display='none'};await pc.setLocalDescription(await pc.createOffer());await ice(pc);const r=await fetch('/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:pc.localDescription.sdp,type:pc.localDescription.type})});await pc.setRemoteDescription(await r.json());setInterval(stats,1000)}
startButton.onclick=()=>start().catch(e=>{console.error(e);startButton.disabled=false});q('#recordStart').onclick=()=>fetch('/route/record/start',{method:'POST'}).then(backend);q('#recordStop').onclick=()=>fetch('/route/record/stop',{method:'POST'}).then(backend);setInterval(backend,500);backend();
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['w','a','s','d','q','c','m',' '].includes(k))e.preventDefault();if(k in keys)keys[k]=true;if(k===' ')keys.space=true;if(!e.repeat&&k==='q')reverse=!reverse;if(!e.repeat&&k==='c'){viewIndex=(viewIndex+1)%views.length;view.textContent=views[viewIndex]}if(!e.repeat&&k==='m'){autoEnabled=!autoEnabled;mode.textContent=autoEnabled?'AUTO':'MANUAL';mode.className=autoEnabled?'ok':'metric'}send()});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in keys)keys[k]=false;if(k===' ')keys.space=false;send()});window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;send()});
</script></body></html>
