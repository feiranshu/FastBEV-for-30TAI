# MatrixVT NuScenes serial runtime configuration.
#
# Data path:
#   6 camera images -> MatrixVT FP32 NCHW preprocessing
#   -> single MatrixVT NPU forward
#   -> raw output txt for official mini_val scenes only.

device:
  url: axi://zg330aiu?npu=0x40000000&dma=0x80000000
  mmuMode: true
  speedMode: false
  compressFtmp: false
  ocm_option: -1

matrixvt:
  dir: ./imodel/matrixvt/nuscenes
  stage: g
  run_backend: zg330
  input_name: images
  output_name: predictions

dataset:
  imageDir: ./io/input/data/dataset_info.json
  boxDir: ./io/output/result
  pngDir: ./io/output/png
  paraDir: ./io/output/parameter
  rawOutputDir: ./io/output/matrixvt_raw
  logDir: ./io/log
  evalScenes:
    - scene-0103
    - scene-0916

preprocess:
  camera_order:
    - CAM_FRONT_LEFT
    - CAM_FRONT
    - CAM_FRONT_RIGHT
    - CAM_BACK_LEFT
    - CAM_BACK
    - CAM_BACK_RIGHT
  source_width: 1600
  source_height: 900
  resize_width: 704
  resize_height: 396
  crop_x: 0
  crop_y: 140
  crop_width: 704
  crop_height: 256
  interpolation: bicubic
  mean: [123.675, 116.28, 103.53]
  std: [58.395, 57.12, 57.375]

postprocess:
  score_threshold: 0.10
  max_num: 500
  post_max_size: 83
  max_boxes: 100
  post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
  circle_thresholds: [4.0, 12.0, 10.0, 1.0, 0.85, 0.175]

visualize:
  enabled: false

output:
  rawOnly: true
